# kitty: minimal, light on resources. Colors: theme.conf, generated by
# hypr-theme from the active palette (hypr/.config/hypr/themes/<name>.colors).
# Docs: https://sw.kovidgoyal.net/kitty/conf/
# Reload: ctrl+shift+f5, or hypr-reload (SUPER+SHIFT+R)

include theme.conf

# --- Font ------------------------------------------------------------------

# Liberation Mono = Cousine metrics (the reference's terminal font), same as Waybar.
font_family      Liberation Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Nerd Font icons (prompt glyphs, file icons) come from FantasqueSansM.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD FantasqueSansM Nerd Font Mono

# --- Window ----------------------------------------------------------------

window_padding_width     8
hide_window_decorations  yes
confirm_os_window_close  0
remember_window_size     no

# Opaque: transparency makes the compositor redraw what's behind.
background_opacity 1.0

# --- Cursor ----------------------------------------------------------------

cursor_shape          block
# No blinking: avoids redrawing twice a second while idle.
cursor_blink_interval 0
cursor_trail          0

# --- Behaviour -------------------------------------------------------------

enable_audio_bell    no
visual_bell_duration 0
scrollback_lines     5000
copy_on_select       no
strip_trailing_spaces smart
detect_urls          yes
underline_hyperlinks hover

# --- Tabs ------------------------------------------------------------------

tab_bar_edge       bottom
tab_bar_style      separator
tab_separator      "  "
tab_title_template " {index}: {title} "
