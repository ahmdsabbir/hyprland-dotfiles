# Light: monotone ink on grey paper. Keep base colors in sync with
# hypr/.config/hypr/themes/light.lua.
#
# ANSI colors are muted, ink-like hues so git diffs, ls and errors stay
# readable. All reach >= 4.5:1 contrast on the background (WCAG AA), except
# color8, which is deliberately faint (3.3:1) for hints and autosuggestions.

# --- Base ------------------------------------------------------------------

foreground             #3b3b3b
background             #cccccc
selection_foreground   #3b3b3b
selection_background   #b0b0b0
url_color              #2b4a75

cursor                 #474747
cursor_text_color      #cccccc

# Window borders (kitty splits) and the bell
active_border_color    #7a7a7a
inactive_border_color  #a8a8a8
bell_border_color      #474747

# --- Tabs ------------------------------------------------------------------

tab_bar_background     #c2c2c2
tab_bar_margin_color   #c2c2c2
active_tab_foreground  #c8c8c8
active_tab_background  #474747
active_tab_font_style  normal
inactive_tab_foreground #646464
inactive_tab_background #c2c2c2
inactive_tab_font_style normal

# --- ANSI colors -----------------------------------------------------------

# black
color0  #3b3b3b
color8  #6b6b6b
# red
color1  #8a2f2f
color9  #7a3a3a
# green
color2  #0b5c2c
color10 #2c5e3d
# yellow
color3  #6b5410
color11 #62501c
# blue
color4  #2b4a75
color12 #3d5578
# magenta
color5  #663d69
color13 #6a4a6d
# cyan
color6  #1f5c5c
color14 #2c5655
# white (dark enough to stay readable on the light background)
color7  #555555
color15 #474747

# --- 256-color overrides -----------------------------------------------------
# Some programs pick from the 256-color palette, whose light entries are made
# for dark backgrounds (~1.0-1.4:1 contrast here, i.e. invisible). Remap the
# common ones to ink versions of the same hue (all >= 4.5:1). Prompts and
# tools should prefer the 16 theme colors above (the yonko zsh prompt does).
color67  #3d5578
color75  #2b4a75
color76  #0b5c2c
color81  #24566b
color87  #1f5c5c
color113 #2c5e3d
color116 #2c5655

# Marks (kitty's highlight feature)
mark1_foreground #cccccc
mark1_background #474747
