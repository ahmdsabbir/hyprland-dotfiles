# hyprlock: modern minimal lock screen (light theme).
# Palette: keep in sync with themes/light.lua. Format: hyprlang (not Lua).
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Lock: SUPER+L, Waybar power menu, or after idle (hypridle.conf).
# Clear the password: Esc, Ctrl+U, Ctrl+Backspace.
# Note: "#" starts a comment in hyprlang; write "##" for a literal "#".

$base     = rgb(d9d9d9)
$surface  = rgb(cccccc)
$overlay  = rgb(a8a8a8)
$border   = rgb(7a7a7a)
$muted    = rgb(828282)
$subtext  = rgb(646464)
$text     = rgb(3b3b3b)
$accent   = rgb(474747)
$red      = rgb(8a2f2f)
$yellow   = rgb(6b5410)

$font       = Liberation Mono
$font_light = Noto Sans Mono Light

general {
    hide_cursor        = true
    ignore_empty_input = true
}

# Short fades; no blur or screenshot, so nothing renders while you're away.
animations {
    enabled   = true
    bezier    = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn,           1, 3, easeOut
    animation = fadeOut,          1, 3, easeOut
    animation = inputFieldDots,   1, 2, easeOut
    animation = inputFieldColors, 1, 3, easeOut
}

background {
    monitor =
    color   = $base
}

# --- Clock -------------------------------------------------------------------

label {
    monitor     =
    text        = $TIME
    font_family = $font_light
    font_size   = 112
    color       = $text
    position    = 0, 150
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d %B"
    font_family = $font
    font_size   = 15
    color       = $subtext
    position    = 0, 55
    halign      = center
    valign      = center
}

# --- Password ----------------------------------------------------------------

input-field {
    monitor =
    size    = 300, 50
    rounding          = 6
    outline_thickness = 2

    outer_color    = $overlay   # idle
    inner_color    = $surface
    font_color     = $text
    check_color    = $border    # verifying
    fail_color     = $red       # wrong password
    capslock_color = $yellow    # Caps Lock on

    font_family      = $font
    placeholder_text = Password
    fail_text        = $FAIL
    fade_on_empty    = false

    dots_size    = 0.22
    dots_spacing = 0.45
    dots_center  = true

    position = 0, -40
    halign   = center
    valign   = center
}

# --- Footer --------------------------------------------------------------------

label {
    monitor     =
    text        = 󰌾  locked · $USER
    font_family = $font
    font_size   = 11
    color       = $muted
    position    = 0, 40
    halign      = center
    valign      = bottom
}
