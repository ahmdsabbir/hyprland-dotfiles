# hypridle: what happens when you're away. Format: hyprlang (not Lua).
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Started from Hyprland's autostart; `hypr-reload` restarts it after edits.
#
# Timeline: 9 min dim (laptops) -> 10 min lock -> 11 min screens off.
# Video/music players that inhibit idle (e.g. browsers playing video) pause this.

general {
    lock_cmd         = pidof hyprlock || hyprlock                       # one lock at a time
    before_sleep_cmd = loginctl lock-session                            # lock before suspend
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # screens on after resume
}

# Dim the backlight. Does nothing on machines without one (e.g. desktops).
listener {
    timeout    = 540
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout    = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend after 30 min. Off by default: on a desktop it would interrupt
# downloads, containers, etc. Uncomment to enable (or put it in a laptop setup).
# listener {
#     timeout    = 1800
#     on-timeout = systemctl suspend
# }
